# Added to WebODM's own docker-compose.yml and .dev.yml by dev/webodm.sh: a WebODM checkout runs in dev mode with
# this repo's plugin mounted as coreplugins/geojson, under its own container names (GJ_PREFIX), port and volumes, so
# it can run beside another WebODM (whose names and port it would take). The images (GJ_*_IMAGE) are each version's,
# pinned by digest in dev/webodm.sh. The processing node is defined here: WebODM's own file for it was renamed in
# 4.0.0 (docker-compose.nodeodm.yml, then .nodeodx.yml).
services:
  db:
    image: ${GJ_DB_IMAGE}
    container_name: ${GJ_PREFIX}-db
  broker:
    image: ${GJ_BROKER_IMAGE}
    container_name: ${GJ_PREFIX}-broker
  node-odx-1:
    image: ${GJ_NODE_IMAGE}
    container_name: ${GJ_PREFIX}-node-odx-1
    expose:
      - "3000"
    restart: unless-stopped
    oom_score_adj: 500
  webapp:
    image: ${GJ_WEBAPP_IMAGE}
    container_name: ${GJ_PREFIX}-webapp
    depends_on:
      - node-odx-1
    environment:
      - WO_DEFAULT_NODES
    ports: !override
      - "${WO_PORT}:8000/tcp"
      - "${GJ_LIVERELOAD_PORT}:35729"
    volumes:
      - ${GJ_PLUGIN_DIR}:/webodm/coreplugins/geojson
  worker:
    image: ${GJ_WEBAPP_IMAGE}
    container_name: ${GJ_PREFIX}-worker
    volumes:
      - ${GJ_PLUGIN_DIR}:/webodm/coreplugins/geojson
